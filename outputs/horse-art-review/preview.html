    /*
 * Pet animation. Only transform and opacity are animated. Every part says
 * where it pivots with an inline `transform-origin` in the drawing's own
 * 0–200 coordinates (`view-box`), so this file holds the motion and the
 * drawings hold the geometry — one stylesheet moves every species.
 *
 * Moving parts must not carry an SVG `transform` attribute: the CSS transform
 * replaces it. Anything that needs placing is wrapped in a <g> that does the
 * placing, and the class goes on the child.
 */

.pet {
  overflow: visible;
}

.pet :is(.pet-bob, .pet-body, .pet-tail, .pet-head, .pet-eye, .pet-ear, .pet-ear-alt, .pet-nose, .pet-paw, .pet-shadow, .pet-halo, .pet-tear, .pet-rumble) {
  transform-box: view-box;
}

.pet-body { animation: pet-breathe 3.2s ease-in-out infinite; }
.pet-tail { animation: pet-swish 2.6s ease-in-out infinite; }
.pet-head { animation: pet-look 5s ease-in-out infinite; }
.pet-eye { animation: pet-blink 4.6s infinite; }
.pet-ear { animation: pet-twitch 6s infinite; }
.pet-ear-alt { animation: pet-twitch-alt 7.4s infinite; }
.pet-nose { animation: pet-wiggle 1.4s ease-in-out infinite; }

/* Happy: hops, nods along, tail going. */
.mood-happy .pet-bob { animation: pet-hop 1.6s ease-in-out infinite; }
.mood-happy .pet-shadow { animation: pet-shadow 1.6s ease-in-out infinite; }
.mood-happy .pet-head { animation: pet-nod 1.6s ease-in-out infinite; }
.mood-happy .pet-tail { animation-duration: 1.1s; }

/* Sad and sick: head hangs, everything slows. */
.mood-sad .pet-head,
.mood-sick .pet-head {
  animation: none;
  transform: rotate(9deg);
}
.pet-cat:is(.mood-sad, .mood-sick) .pet-head,
.pet-tiger:is(.mood-sad, .mood-sick) .pet-head,
.pet-dog:is(.mood-sad, .mood-sick) .pet-head,
.pet-bunny:is(.mood-sad, .mood-sick) .pet-head {
  /* The front-facing pets hang their heads down, not sideways. */
  transform: translateY(5px) rotate(-3deg);
}
.mood-sad .pet-tail,
.mood-sick .pet-tail { animation-duration: 5s; }
.mood-sick .pet-body { animation-duration: 5s; }

/* Hungry: nose down, sniffing about for something to eat. */
.mood-hungry .pet-head { animation: pet-sniff 2.4s ease-in-out infinite; }
.pet-cat.mood-hungry .pet-head,
.pet-tiger.mood-hungry .pet-head,
.pet-dog.mood-hungry .pet-head,
.pet-bunny.mood-hungry .pet-head { animation: pet-beg 2.4s ease-in-out infinite; }

.mood-vacation .pet-head { animation: pet-sway 4s ease-in-out infinite; }

/* Asleep: head down, breathing slow and deep, tail still. */
.mood-asleep .pet-head {
  animation: none;
  transform: rotate(12deg);
}
.pet-cat.mood-asleep .pet-head,
.pet-tiger.mood-asleep .pet-head,
.pet-dog.mood-asleep .pet-head,
.pet-bunny.mood-asleep .pet-head { transform: translateY(6px) rotate(-6deg); }
.mood-asleep .pet-body { animation-duration: 4.8s; }
.mood-asleep :is(.pet-tail, .pet-ear, .pet-ear-alt, .pet-eye, .pet-nose) { animation: none; }

.pet-z {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 0;
  animation: pet-z 2.7s ease-out infinite;
}

/* Gone: faded, floating, still. */
.mood-gone {
  filter: grayscale(1);
  opacity: 0.55;
}
.mood-gone .pet-bob { animation: pet-float 3s ease-in-out infinite; }
.mood-gone :is(.pet-body, .pet-tail, .pet-head, .pet-ear, .pet-ear-alt, .pet-nose) { animation: none; }

.pet-sparkle {
  transform-box: fill-box;
  transform-origin: center;
  animation: pet-twinkle 1.8s ease-in-out infinite;
}
.pet-tear { animation: pet-drip 2.2s ease-in infinite; }
.pet-halo { animation: pet-halo 2.4s ease-in-out infinite; }
.pet-rumble { animation: pet-rumble 0.9s ease-in-out infinite; }

/*
 * Things done to the pet, played once over whatever the mood is doing. They
 * come after the moods on purpose: a sleepy horse still chews its carrot.
 */
.act-eat .pet-head { animation: pet-chomp 0.28s ease-in-out 5; }
.act-cheer .pet-bob { animation: pet-cheer 0.7s ease-out 2; }
.act-cheer .pet-shadow { animation: pet-shadow 0.7s ease-out 2; }
.act-wash .pet-body { animation: pet-shiver 0.18s ease-in-out 8; }
.pet-bubble {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 0;
  animation: pet-bubble 1.3s ease-out 2 both;
}

/* The small avatars, and anyone who asked the device for less motion. */
.pet--still,
.pet--still * {
  animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .pet,
  .pet * {
    animation: none !important;
  }
}
/* Not drifting, the z's still have to be seen: stacked where they would rise. */
.pet--still .pet-z { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .pet .pet-z { opacity: 1; }
}

@keyframes pet-breathe {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.015, 1.035); }
}
@keyframes pet-swish {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(10deg); }
}
@keyframes pet-look {
  0%, 100% { transform: rotate(0deg); }
  40% { transform: rotate(-3deg); }
  60% { transform: rotate(2deg); }
}
@keyframes pet-blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}
@keyframes pet-twitch {
  0%, 84%, 100% { transform: rotate(0deg); }
  88% { transform: rotate(-14deg); }
  92% { transform: rotate(4deg); }
}
@keyframes pet-twitch-alt {
  0%, 60%, 100% { transform: rotate(0deg); }
  64% { transform: rotate(12deg); }
  68% { transform: rotate(-4deg); }
}
@keyframes pet-wiggle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-0.8px) scale(1.06); }
}
@keyframes pet-hop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes pet-shadow {
  0%, 100% { transform: scale(1); opacity: 0.14; }
  50% { transform: scale(0.82); opacity: 0.09; }
}
@keyframes pet-nod {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-5deg); }
}
@keyframes pet-sniff {
  0%, 100% { transform: rotate(2deg); }
  50% { transform: rotate(14deg); }
}
@keyframes pet-beg {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-8deg) translateY(-2px); }
  75% { transform: rotate(8deg) translateY(-2px); }
}
@keyframes pet-sway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(3deg); }
}
@keyframes pet-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes pet-twinkle {
  0%, 100% { transform: scale(0.4); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
}
@keyframes pet-drip {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(12px); opacity: 0; }
}
@keyframes pet-halo {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes pet-rumble {
  0%, 100% { transform: translateX(0); opacity: 0.4; }
  50% { transform: translateX(3px); opacity: 1; }
}
@keyframes pet-chomp {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(6deg) translateY(3px); }
}
@keyframes pet-cheer {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  15% { transform: translateY(0) scale(1.06, 0.92); }
  50% { transform: translateY(-22px) scale(0.96, 1.05); }
  80% { transform: translateY(0) scale(1.04, 0.95); }
}
@keyframes pet-shiver {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}
@keyframes pet-bubble {
  0% { opacity: 0; transform: translateY(0) scale(0.4); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-46px) scale(1.2); }
}

@keyframes pet-z {
  0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(14px, -34px) scale(1.2); }
}

/* The horse rests between gestures. Its feet stay planted; only short reactions hop. */
.pet-horse .pet-body {
  animation: horse-breathe 4.6s ease-in-out infinite;
}
.pet-horse .pet-head {
  animation: horse-look 9s ease-in-out infinite;
}
.pet-horse .pet-tail {
  animation: horse-tail 7.8s ease-in-out infinite;
}
.pet-horse .pet-eye { animation-duration: 6.2s; }
.pet-horse .pet-ear { animation-duration: 9.4s; }
.pet-horse .pet-ear-alt { animation-duration: 11s; animation-delay: -4s; }
.pet-horse :is(.horse-foreleg, .horse-hindleg, .horse-mouth) { transform-box: view-box; }
.pet-horse .horse-foreleg { animation: horse-paw 14s ease-in-out infinite; }

.pet-horse.mood-happy .pet-bob { animation: none; }
.pet-horse.mood-happy .pet-shadow { animation: none; }
.pet-horse.mood-happy .pet-head { animation: horse-happy-look 7.5s ease-in-out infinite; }
.pet-horse.mood-happy .pet-tail { animation-duration: 5.8s; }
.pet-horse.mood-happy .pet-sparkle { animation-duration: 4.2s; }

.pet-horse:is(.mood-sad, .mood-sick) .pet-head { animation: none; transform: rotate(6deg); }
.pet-horse:is(.mood-sad, .mood-sick) .pet-tail { animation-duration: 12s; }
.pet-horse.mood-sick .pet-body { animation-duration: 6s; }
.pet-horse:is(.mood-sad, .mood-sick, .mood-asleep, .mood-gone) .horse-foreleg { animation: none; }
.pet-horse.mood-hungry .pet-head { animation: horse-sniff 6.5s ease-in-out infinite; }
.pet-horse.mood-vacation .pet-head { animation: horse-look 11s ease-in-out infinite; }
.pet-horse.mood-asleep .pet-head { animation: none; transform: rotate(9deg); }
.pet-horse.mood-asleep .pet-body { animation-duration: 6s; }
.pet-horse.mood-asleep :is(.pet-tail, .pet-eye, .pet-ear, .pet-ear-alt) { animation: none; }
.pet-horse.mood-gone :is(.pet-body, .pet-tail, .pet-head, .pet-ear, .pet-ear-alt) { animation: none; }

/* Action selectors stay more specific than the resting moods. */
.pet-horse.act-eat .pet-head { animation: horse-eat-nod 0.5s ease-in-out 3; }
.pet-horse.act-eat .horse-mouth { animation: horse-chew 0.28s ease-in-out 5; }
.pet-horse.act-cheer .pet-bob { animation: horse-cheer 0.75s ease-out 2; }
.pet-horse.act-cheer .pet-shadow { animation: pet-shadow 0.75s ease-out 2; }
.pet-horse.act-cheer .horse-foreleg { animation: none; }
.pet-horse.act-wash .pet-body { animation: horse-wash 0.25s ease-in-out 6; }

/* CSS only: no animation library, per-frame React updates, filters or redraw loop. */
@keyframes horse-breathe {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.009); }
}
@keyframes horse-look {
  0%, 38%, 68%, 100% { transform: rotate(0); }
  45%, 54% { transform: rotate(-2deg); }
  61% { transform: rotate(0.7deg); }
}
@keyframes horse-happy-look {
  0%, 52%, 82%, 100% { transform: rotate(0); }
  60% { transform: rotate(-2.5deg); }
  67% { transform: rotate(1deg); }
  74% { transform: rotate(-1.5deg); }
}
@keyframes horse-tail {
  0%, 24%, 66%, 100% { transform: rotate(0); }
  34% { transform: rotate(8deg); }
  43% { transform: rotate(-5deg); }
  52% { transform: rotate(5deg); }
  59% { transform: rotate(-2deg); }
}
@keyframes horse-paw {
  0%, 80%, 98%, 100% { transform: rotate(0); }
  86%, 91% { transform: rotate(-7deg) translateY(-1px); }
  95% { transform: rotate(1deg); }
}
@keyframes horse-sniff {
  0%, 30%, 80%, 100% { transform: rotate(0); }
  48%, 66% { transform: rotate(5deg); }
  55% { transform: rotate(4deg); }
}
@keyframes horse-eat-nod {
  0%, 100% { transform: rotate(0); }
  50% { transform: rotate(2deg); }
}
@keyframes horse-chew {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(0.7px) scaleY(0.85); }
}
@keyframes horse-cheer {
  0%, 100% { transform: translateY(0); }
  18% { transform: translateY(1px); }
  48% { transform: translateY(-9px); }
  78% { transform: translateY(0); }
}
@keyframes horse-wash {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-0.6px); }
  75% { transform: translateX(0.6px); }
}

/* Preserve visible sleep marks when the in-app setting stops their keyframes. */
html.reduce-motion .pet-horse .pet-z { opacity: 1; }
